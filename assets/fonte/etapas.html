<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="estilo.css">
<style>
  .quadro { width: 1280px; height: 400px; --brilho-x: 12%; --brilho-y: 100%; }
  .triangulos { left: -330px; top: 40px; width: 640px; height: 640px; opacity: 0.55; }
  .linha { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 48px; }
  .card {
    position: relative; width: 210px; height: 264px; padding: 26px 22px;
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border: 1px solid rgba(216, 255, 41, 0.22);
    display: flex; flex-direction: column;
  }
  .num { font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -0.03em; }
  .nome { margin-top: 44px;font-weight: 800; font-size: 30px; letter-spacing: -0.01em; }
  .desc { margin-top: 8px; font-weight: 500; font-size: 17px; line-height: 1.3; color: var(--texto-suave); }
  .seta { width: 18px; flex: none; }
  .seta path { fill: var(--lima); }
  .card.ultima { border-color: rgba(216, 255, 41, 0.6); background: linear-gradient(180deg, rgba(216,255,41,0.14), rgba(216,255,41,0.03)); }
</style>
</head>
<body>
<div class="quadro">
  <svg class="triangulos" viewBox="0 0 100 100">
    <g transform="translate(50 50)">
      <path d="M-26 -38 L40 0 L-26 38 Z" transform="rotate(10) scale(1.0)" stroke-width="0.35" opacity="0.4"/>
      <path d="M-26 -38 L40 0 L-26 38 Z" transform="rotate(10) scale(0.75)" stroke-width="0.3" opacity="0.3"/>
      <path d="M-26 -38 L40 0 L-26 38 Z" transform="rotate(10) scale(0.5)" stroke-width="0.3" opacity="0.22"/>
    </g>
  </svg>

  <div class="linha">
    <div class="card"><div class="num lima">1</div><div class="nome">Organiza</div><div class="desc">Prepara os<br>vídeos brutos</div></div>
    <svg class="seta" viewBox="0 0 10 12"><path d="M1 1 L9 6 L1 11 Z"/></svg>
    <div class="card"><div class="num lima">2</div><div class="nome">Planeja</div><div class="desc">Monta o roteiro<br>e você aprova</div></div>
    <svg class="seta" viewBox="0 0 10 12"><path d="M1 1 L9 6 L1 11 Z"/></svg>
    <div class="card"><div class="num lima">3</div><div class="nome">Edita</div><div class="desc">Corta, limpa a voz<br>e anima os textos</div></div>
    <svg class="seta" viewBox="0 0 10 12"><path d="M1 1 L9 6 L1 11 Z"/></svg>
    <div class="card"><div class="num lima">4</div><div class="nome">Sonoriza</div><div class="desc">Trilha e efeitos<br>no tempo certo</div></div>
    <svg class="seta" viewBox="0 0 10 12"><path d="M1 1 L9 6 L1 11 Z"/></svg>
    <div class="card ultima"><div class="num lima">5</div><div class="nome">Entrega</div><div class="desc">Revisa e exporta<br>o vídeo pronto</div></div>
  </div>
</div>
</body>
</html>
