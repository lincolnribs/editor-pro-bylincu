<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="estilo.css">
<style>
  html, body { background: transparent; }
  .linha { width: 1280px; height: 72px; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .selo {
    font-weight: 700; font-size: 18px; letter-spacing: 0.02em; color: var(--texto);
    padding: 10px 20px; border-radius: 999px; background: #000;
    border: 1.5px solid rgba(216, 255, 41, 0.6);
    display: inline-block; white-space: pre;
  }
  .selo b { font-weight: 800; color: var(--lima); }
</style>
</head>
<body>
<div class="linha">
  <span class="selo"><b>BETA</b></span>
  <span class="selo">Plugin do <b>Claude Code</b></span>
  <span class="selo">Motor <b>raea</b> na GPU</span>
  <span class="selo">Em <b>português</b></span>
  <span class="selo">Ferramentas <b>grátis</b></span>
</div>
</body>
</html>
