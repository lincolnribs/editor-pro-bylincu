<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="cards.css">
<style>
  .quadro { width: 1280px; height: 300px; --brilho-x: 50%; --brilho-y: 120%; }
  .linha { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 0 48px; }
  .card { width: 360px; height: 196px; flex-direction: row; align-items: center; gap: 20px; }
  .num { font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -0.03em; flex: none; width: 44px; }
  .card .titulo { font-size: 25px; }
</style>
</head>
<body>
<div class="quadro">
  <div class="linha">
    <div class="card"><div class="num lima">1</div><div><div class="titulo">Copie o link</div><div class="desc">O endereço deste<br>repositório, logo abaixo</div></div></div>
    <svg class="seta" viewBox="0 0 10 12"><path d="M1 1 L9 6 L1 11 Z"/></svg>
    <div class="card"><div class="num lima">2</div><div><div class="titulo">Cole no Claude</div><div class="desc">E escreva<br>“instala isso”</div></div></div>
    <svg class="seta" viewBox="0 0 10 12"><path d="M1 1 L9 6 L1 11 Z"/></svg>
    <div class="card destaque"><div class="num lima">3</div><div><div class="titulo">Reinicie</div><div class="desc">E mande o vídeo:<br>“edita esse vídeo”</div></div></div>
  </div>
</div>
</body>
</html>
