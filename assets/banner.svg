<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="Editor Pro by Lincu">
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#B8E351" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#23430C" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#050607" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="1" r="0.45">
      <stop offset="0" stop-color="#23430C" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#050607" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="borda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="cubo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8E351"/>
      <stop offset="1" stop-color="#23430C"/>
    </linearGradient>
    <filter id="desfoque" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/></filter>
    <pattern id="pontos" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#FFFFFF" fill-opacity="0.16"/></pattern>
    <clipPath id="quadro"><rect width="1280" height="460" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#quadro)">
    <rect width="1280" height="460" fill="#050607"/>
    <rect width="1280" height="460" fill="url(#glow2)"/>
    <rect width="1280" height="460" fill="url(#glow)"/>
    <rect x="640" y="0" width="640" height="460" fill="url(#pontos)"/>

    <!-- formas de vidro verdes ao fundo (como os cubos da referência) -->
    <g opacity="0.9">
      <rect x="930" y="40" width="190" height="190" rx="34" fill="url(#cubo)" transform="rotate(45 1025 135)" opacity="0.55"/>
      <rect x="1040" y="250" width="160" height="160" rx="30" fill="url(#cubo)" transform="rotate(45 1120 330)" opacity="0.45"/>
      <rect x="930" y="40" width="190" height="190" rx="34" fill="none" stroke="#B8E351" stroke-opacity="0.5" stroke-width="2" transform="rotate(45 1025 135)"/>
    </g>

    <!-- barra de navegação -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <!-- marca em pixel -->
      <g transform="translate(56 40)" fill="#FFFFFF">
        <rect x="0" y="0" width="6" height="6"/><rect x="6" y="0" width="6" height="6"/><rect x="12" y="0" width="6" height="6"/>
        <rect x="0" y="6" width="6" height="6"/><rect x="0" y="12" width="6" height="6"/><rect x="6" y="12" width="6" height="6"/>
        <rect x="0" y="18" width="6" height="6"/><rect x="0" y="24" width="6" height="6"/><rect x="6" y="24" width="6" height="6"/><rect x="12" y="24" width="6" height="6"/>
        <rect x="24" y="0" width="6" height="6" fill="#B8E351"/><rect x="30" y="0" width="6" height="6" fill="#B8E351"/><rect x="36" y="0" width="6" height="6" fill="#B8E351"/>
        <rect x="24" y="6" width="6" height="6" fill="#B8E351"/><rect x="36" y="6" width="6" height="6" fill="#B8E351"/>
        <rect x="24" y="12" width="6" height="6" fill="#B8E351"/><rect x="30" y="12" width="6" height="6" fill="#B8E351"/><rect x="36" y="12" width="6" height="6" fill="#B8E351"/>
        <rect x="24" y="18" width="6" height="6" fill="#B8E351"/><rect x="24" y="24" width="6" height="6" fill="#B8E351"/>
      </g>
      <text x="112" y="62" fill="#FFFFFF" font-size="17" font-weight="700">Editor Pro</text>

      <g font-size="13" font-weight="600" fill="#FFFFFF" fill-opacity="0.75" text-anchor="middle">
        <rect x="470" y="38" width="86" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
        <text x="513" y="59">preparar</text>
        <rect x="564" y="38" width="70" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
        <text x="599" y="59">plano</text>
        <rect x="642" y="38" width="80" height="32" rx="16" fill="#B8E351" fill-opacity="0.16" stroke="#B8E351" stroke-opacity="0.7"/>
        <text x="682" y="59" fill="#B8E351" fill-opacity="1">montar</text>
        <rect x="730" y="38" width="60" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
        <text x="760" y="59">som</text>
        <rect x="798" y="38" width="84" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
        <text x="840" y="59">entregar</text>
      </g>
      <rect x="1124" y="36" width="100" height="36" rx="18" fill="#B8E351"/>
      <text x="1174" y="59" text-anchor="middle" fill="#050607" font-size="14" font-weight="800">versão 3</text>
    </g>

    <!-- título -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="52" y="196" fill="#FFFFFF" font-size="92" font-weight="600" letter-spacing="-4.5">Edite seus</text>
      <text x="52" y="282" fill="#B8E351" font-size="92" font-weight="600" letter-spacing="-4.5">Reels <tspan fill="#FFFFFF">com IA</tspan></text>
      <text x="56" y="326" fill="#FFFFFF" fill-opacity="0.62" font-size="17" font-weight="500">Editor Pro by Lincu: do bruto ao vídeo pronto, etapa por etapa,</text>
      <text x="56" y="348" fill="#FFFFFF" fill-opacity="0.62" font-size="17" font-weight="500">com Claude Code e Remotion. Em português e grátis.</text>
      <!-- botão -->
      <rect x="54" y="378" width="200" height="50" rx="12" fill="#B8E351"/>
      <text x="80" y="409" fill="#050607" font-size="17" font-weight="800">Instalar</text>
      <path d="M196 403 H226 M216 393 L226 403 L216 413" stroke="#050607" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- ícones redondos -->
      <g fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.6">
        <circle cx="290" cy="403" r="17"/><circle cx="328" cy="403" r="17"/><circle cx="366" cy="403" r="17"/>
      </g>
      <path d="M285 395 L298 403 L285 411 Z" fill="#FFFFFF"/>
      <g fill="#FFFFFF"><rect x="320" y="399" width="3" height="8" rx="1.5"/><rect x="326" y="394" width="3" height="18" rx="1.5"/><rect x="332" y="397" width="3" height="12" rx="1.5"/></g>
      <text x="366" y="409" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">T</text>
      <text x="398" y="399" fill="#FFFFFF" fill-opacity="0.6" font-size="12.5" font-weight="500">voz limpa, texto cinético,</text>
      <text x="398" y="415" fill="#FFFFFF" fill-opacity="0.6" font-size="12.5" font-weight="500">SFX e volume medido</text>
    </g>

    <!-- cards de vidro -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" filter="url(#sombra)">
      <!-- card 1: voz -->
      <g transform="translate(760 118)">
        <rect width="300" height="128" rx="20" fill="url(#vidro)" stroke="url(#borda)" stroke-width="1.2"/>
        <text x="22" y="34" fill="#FFFFFF" fill-opacity="0.6" font-size="13" font-weight="600">VOZ LIMPA</text>
        <rect x="200" y="18" width="80" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.2"/>
        <text x="240" y="36" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.85" font-size="12" font-weight="600">take 03</text>
        <g fill="#B8E351">
          <rect x="22" y="78" width="5" height="12" rx="2.5"/><rect x="32" y="70" width="5" height="28" rx="2.5"/><rect x="42" y="74" width="5" height="20" rx="2.5"/>
          <rect x="52" y="62" width="5" height="44" rx="2.5"/><rect x="62" y="72" width="5" height="24" rx="2.5"/><rect x="72" y="78" width="5" height="12" rx="2.5"/>
          <rect x="82" y="66" width="5" height="36" rx="2.5"/><rect x="92" y="74" width="5" height="20" rx="2.5"/><rect x="102" y="70" width="5" height="28" rx="2.5"/>
          <rect x="112" y="80" width="5" height="8" rx="2.5"/><rect x="122" y="68" width="5" height="32" rx="2.5"/><rect x="132" y="76" width="5" height="16" rx="2.5"/>
        </g>
        <text x="278" y="98" text-anchor="end" fill="#FFFFFF" font-size="34" font-weight="600" letter-spacing="-1.5">-14<tspan fill="#FFFFFF" fill-opacity="0.45" font-size="18"> LUFS</tspan></text>
        <text x="278" y="116" text-anchor="end" fill="#B8E351" font-size="11.5" font-weight="600">eco e ruído removidos</text>
      </g>

      <!-- botão redondo entre os cards -->
      <g transform="translate(1028 262)">
        <circle r="22" fill="#B8E351"/>
        <path d="M-7 -6 V6 M-11 2 L-7 6 L-3 2 M7 6 V-6 M3 -2 L7 -6 L11 -2" stroke="#050607" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- card 2: prévia -->
      <g transform="translate(830 290)">
        <rect width="330" height="128" rx="20" fill="url(#vidro)" stroke="url(#borda)" stroke-width="1.2"/>
        <rect x="18" y="16" width="54" height="96" rx="10" fill="#050607" stroke="#B8E351" stroke-width="2"/>
        <rect x="26" y="70" width="38" height="6" rx="3" fill="#FFFFFF"/>
        <rect x="31" y="80" width="28" height="6" rx="3" fill="#B8E351"/>
        <path d="M39 38 L51 46 L39 54 Z" fill="#B8E351"/>
        <text x="92" y="40" fill="#FFFFFF" fill-opacity="0.6" font-size="13" font-weight="600">PRÉVIA 1080×1920</text>
        <text x="92" y="82" fill="#FFFFFF" font-size="34" font-weight="600" letter-spacing="-1.5">00:24<tspan fill="#FFFFFF" fill-opacity="0.45" font-size="18">.12</tspan></text>
        <rect x="92" y="98" width="216" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.12"/>
        <rect x="92" y="98" width="140" height="6" rx="3" fill="#B8E351"/>
        <text x="308" y="40" text-anchor="end" fill="#B8E351" font-size="11.5" font-weight="600">✓ conferido</text>
      </g>
    </g>

    <!-- cursor em pixel -->
    <g transform="translate(1178 196) scale(1.5)">
      <path d="M0 0 h6 v6 h6 v6 h6 v6 h6 v6 h6 v6 h-12 v6 h6 v6 h6 v6 h-6 v6 h-6 v-6 h-6 v-6 h-6 v6 h-6 z" fill="#FFFFFF"/>
      <path d="M6 12 h6 v6 h6 v6 h6 v6 h-12 v6 h-6 z" fill="#050607"/>
    </g>
  </g>
</svg>
